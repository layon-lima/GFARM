name: GFARM - Infraestrutura e Control

on:
  pull_request:
    paths:
      - 'GFARM APP/ops/gfarm_control/**'
      - 'GFARM APP/ops/migrar_servidor.py'
      - 'GFARM APP/deploy/**'
      - '.github/workflows/infra-ci.yml'
  push:
    branches: [main]
    paths:
      - 'GFARM APP/ops/gfarm_control/**'
      - 'GFARM APP/ops/migrar_servidor.py'
      - 'GFARM APP/deploy/**'
      - '.github/workflows/infra-ci.yml'

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: GFARM APP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q ops/gfarm_control ops/migrar_servidor.py
      - run: python ops/gfarm_control/test_control.py
      - run: python -m unittest discover -s tests -p 'test_server_migration.py' -v
      - run: python -m pip install pyyaml
      - run: python -c "import yaml; yaml.safe_load(open('deploy/cloud/compose.yml', encoding='utf-8'))"

  powershell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GFARM APP
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe da instalacao
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem ops/gfarm_control -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Erro em $($file.Name): $($errors | Out-String)" }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar compilador Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compilar somente o instalador (sem publicar)
        shell: pwsh
        run: ./ops/gfarm_control/build_windows.ps1
