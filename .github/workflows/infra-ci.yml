name: Validacao de Migracao e Infraestrutura ESTQ

on:
  pull_request:
    paths:
      - 'GFARM APP/ops/**'
      - 'GFARM APP/deploy/**'
      - 'GFARM APP/.dockerignore'
      - '.gitignore'
      - 'GFARM APP/backend/.env.example'
      - 'GFARM APP/backend/app/services/nfe_ticket_watcher.py'
      - 'GFARM APP/tests/test_server_migration.py'
      - '.github/workflows/infra-ci.yml'
  push:
    branches: [main]
    paths:
      - 'GFARM APP/ops/**'
      - 'GFARM APP/deploy/**'
      - 'GFARM APP/.dockerignore'
      - '.gitignore'
      - 'GFARM APP/backend/.env.example'
      - 'GFARM APP/backend/app/services/nfe_ticket_watcher.py'
      - 'GFARM APP/tests/test_server_migration.py'
      - '.github/workflows/infra-ci.yml'

jobs:
  migration-and-cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GFARM APP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testes de integridade e protecao de backup
        run: python -m unittest discover -s tests -p 'test_server_migration.py' -v
      - name: Compilacao scripts
        run: python -m compileall -q ops backend/app/services/nfe_ticket_watcher.py
      - name: Validacao YAML
        run: |
          python -m pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('GFARM APP/deploy/cloud/compose.yml', encoding='utf-8'))"
      - name: Validacao Compose (sem credenciais reais)
        run: |
          cp backend/.env.example backend/.env
          docker compose --env-file backend/.env -f deploy/cloud/compose.yml config -q
          rm backend/.env
      - name: Build da imagem de producao na nuvem
        run: docker build --file deploy/cloud/Dockerfile --tag estq-ci-cloud .

  powershell-syntax:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GFARM APP
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe sem executar inicializadores
        shell: pwsh
        run: |
          $scripts = Get-ChildItem ops/windows -Filter *.ps1
          foreach ($file in $scripts) {
            $tokens = $null
            $erros = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$erros
            ) | Out-Null
            if ($erros.Count -gt 0) {
              throw "Erro de sintaxe em $($file.Name): $($erros | Out-String)"
            }
          }
