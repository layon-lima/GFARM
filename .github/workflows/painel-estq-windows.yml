name: Painel Unico Windows ESTQ

on:
  pull_request:
    paths:
      - 'GFARM APP/ops/painel_estq.py'
      - 'GFARM APP/ops/windows/GFARM_Instalador.iss'
      - 'GFARM APP/ops/local_install.py'
      - 'GFARM APP/tests/test_painel_estq.py'
      - 'GFARM APP/tests/test_local_install.py'
      - '.github/workflows/painel-estq-windows.yml'
      - 'GFARM APP/ops/migrar_servidor.py'
      - 'GFARM APP/ops/remote_update.py'
      - 'GFARM APP/ops/monitor_backend.py'
      - 'GFARM APP/ops/windows/HABILITAR_REMOTO.ps1'
      - 'GFARM APP/ops/windows/REMOTO_COMANDO.ps1'
      - 'GFARM APP/tests/test_remote_update.py'
  push:
    branches: [main]
    paths:
      - 'GFARM APP/ops/painel_estq.py'
      - 'GFARM APP/ops/windows/GFARM_Instalador.iss'
      - 'GFARM APP/ops/local_install.py'
      - 'GFARM APP/tests/test_painel_estq.py'
      - 'GFARM APP/tests/test_local_install.py'
      - '.github/workflows/painel-estq-windows.yml'
      - 'GFARM APP/ops/migrar_servidor.py'
      - 'GFARM APP/ops/remote_update.py'
      - 'GFARM APP/ops/monitor_backend.py'
      - 'GFARM APP/ops/windows/HABILITAR_REMOTO.ps1'
      - 'GFARM APP/ops/windows/REMOTO_COMANDO.ps1'
      - 'GFARM APP/tests/test_remote_update.py'
  workflow_dispatch:

concurrency:
  group: painel-estq-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  painel-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GFARM APP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testes de protecao e sintaxe
        shell: pwsh
        run: |
          python -m compileall -q ops/painel_estq.py ops/local_install.py ops/migrar_servidor.py ops/remote_update.py ops/monitor_backend.py
          $tokens = $null
          $errors = $null
          foreach ($file in @("ops/windows/HABILITAR_REMOTO.ps1", "ops/windows/REMOTO_COMANDO.ps1")) {
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Erro PowerShell: $file" }
          }
          python -m unittest discover -s tests -p 'test_painel_estq.py' -v
          python -m unittest discover -s tests -p 'test_local_install.py' -v
          python -m unittest discover -s tests -p 'test_remote_update.py' -v
      - name: Construir executavel do Painel GFARM
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --paths . --name PAINEL_ESTQ ops/painel_estq.py
          if (-not (Test-Path dist/PAINEL_ESTQ.exe)) {
            throw "Executavel nao foi gerado"
          }
          (Get-FileHash dist/PAINEL_ESTQ.exe -Algorithm SHA256).Hash | Out-File dist/PAINEL_ESTQ.exe.sha256
      - name: Compilar instalador GFARM (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress --limit-output
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Compilador Inno Setup indisponível" }
          & $iscc "ops\windows\GFARM_Instalador.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar GFARM_Instalador.exe" }
          if (-not (Test-Path "dist\setup\GFARM_Instalador.exe")) {
            throw "GFARM_Instalador.exe não encontrado"
          }
          (Get-FileHash "dist\setup\GFARM_Instalador.exe" -Algorithm SHA256).Hash |
            Out-File "dist\setup\GFARM_Instalador.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: GFARM_WINDOWS_INSTALADOR_E_PORTATIL
          path: |
            GFARM APP/dist/PAINEL_ESTQ.exe
            GFARM APP/dist/PAINEL_ESTQ.exe.sha256
            GFARM APP/dist/setup/GFARM_Instalador.exe
            GFARM APP/dist/setup/GFARM_Instalador.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publicar executavel para download apos merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: painel-estq-${{ github.run_number }}
          name: Painel ESTQ Windows - ${{ github.sha }}
          make_latest: true
          prerelease: false
          generate_release_notes: false
          body: |
            Instalador GFARM para Windows 11 com pasta padrão C:\Programas\GFARM.
            Instala o painel, atalhos e desinstalador, sem migrar nem substituir
            o servidor existente ou os dados locais. Também oferece EXE portátil.
            O servidor e seus dados ficam separados em diretório gravável.
          files: |
            GFARM APP/dist/setup/GFARM_Instalador.exe
            GFARM APP/dist/setup/GFARM_Instalador.exe.sha256
            GFARM APP/dist/PAINEL_ESTQ.exe
            GFARM APP/dist/PAINEL_ESTQ.exe.sha256
