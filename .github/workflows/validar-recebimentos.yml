name: Validar recebimentos integrados do GFARM

on:
  push:
    branches: [main]
    paths:
      - 'GFARM APP/backend/app/api/integracao_recebimentos.py'
      - 'GFARM APP/backend/tests/test_integracao_recebimentos.py'
      - 'GFARM APP/backend/app/services/custo_nfe.py'
      - 'GFARM APP/backend/tests/test_custo_nfe.py'
      - 'GFARM APP/src/pages/RecebimentosPendentes.jsx'
      - '.github/workflows/validar-recebimentos.yml'
  workflow_dispatch:

jobs:
  backend-recebimentos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GFARM APP/backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: teste
      DB_USER: teste
      DB_PASSWORD: teste
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: GFARM APP/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v tests.test_integracao_recebimentos tests.test_custo_nfe
      - run: python -m compileall -q app/api/integracao_recebimentos.py
