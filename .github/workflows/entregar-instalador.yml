name: Entregar instalador aprovado

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: Substituir o instalador da Release oficial
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gfarm-instalador-oficial
  cancel-in-progress: false

jobs:
  entregar:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publicar) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[instalar-no-pc]'))
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar compilador
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Falha instalando Inno Setup.' }
      - name: Compilar, testar e substituir somente a Release existente
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw 'A main mudou; publique novamente o commit desejado.' }
          & './GFARM APP/ops/gfarm_control/PUBLICAR_INSTALADOR_GITHUB.ps1' -VersaoAprovada *>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'gfarm-delivery.log')
      - name: Guardar instalador compilado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GFARM_Instalador_Definitivo
          path: |
            GFARM APP/ops/gfarm_control/build/GFARM_Instalador_Definitivo.exe
            GFARM APP/ops/gfarm_control/build/GFARM_Instalador_Definitivo.exe.sha256
          if-no-files-found: ignore
      - name: Registrar resultado verificavel por Git
        if: always()
        shell: pwsh
        env:
          DELIVERY_STATE: ${{ job.status }}
        run: |
          # O agente pode consultar Git mesmo quando api.github.com esta bloqueado.
          # A branch fixa guarda somente o ultimo resultado e seu historico.
          $log = Join-Path $env:RUNNER_TEMP 'gfarm-delivery.log'
          $details = if (Test-Path $log) { (Get-Content $log -Tail 70) -join "`n" } else { 'Consulte a execucao para detalhes.' }
          $details = $details.Replace($env:GH_TOKEN, '[REDACTED]')
          $exe = Join-Path $env:GITHUB_WORKSPACE 'GFARM APP/ops/gfarm_control/build/GFARM_Instalador_Definitivo.exe'
          $sha = if (Test-Path $exe) { (Get-FileHash $exe -Algorithm SHA256).Hash } else { $null }
          $result = @{
            commit = '${{ github.sha }}'
            state = $env:DELIVERY_STATE
            run_url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            download_url = 'https://github.com/layon-lima/GFARM/releases/download/gfarm-instalador-01aab5398bed/GFARM_Instalador_Definitivo.exe'
            sha256 = $sha
            details = $details
          }
          gh auth setup-git --hostname github.com
          if ($LASTEXITCODE -ne 0) { throw 'Falha configurando acesso ao relatorio Git.' }
          $url = 'https://github.com/${{ github.repository }}.git'
          $folder = Join-Path $env:RUNNER_TEMP 'gfarm-installer-status'
          $existing = git ls-remote --heads $url refs/heads/build/instalador-status
          if ($LASTEXITCODE -ne 0) { throw 'Falha consultando branch do relatorio.' }
          if ($existing) {
            git clone --depth 1 --single-branch --branch build/instalador-status $url $folder
          } else {
            git init -b build/instalador-status $folder
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha preparando relatorio.' }
          Set-Location $folder
          git config user.name 'GFARM Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $result | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 installer-result.json
          git add installer-result.json
          git commit -m 'Resultado do instalador ${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Falha gravando resultado.' }
          git push $url HEAD:refs/heads/build/instalador-status
          if ($LASTEXITCODE -ne 0) { throw 'Falha enviando resultado.' }
